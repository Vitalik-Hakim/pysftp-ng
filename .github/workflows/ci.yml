name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run against the newest paramiko and Python releases, so upstream
    # breakage shows up here before users report it.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: py${{ matrix.python }} · paramiko ${{ matrix.paramiko }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        paramiko: ["3.4.1", "latest"]
        include:
          # actions/setup-python has no Python 3.9 builds for Ubuntu 26.04, which
          # ubuntu-latest now uses. Ubuntu 24.04 still has them.
          - { os: ubuntu-24.04, python: "3.9", paramiko: "3.4.1" }
          - { os: ubuntu-24.04, python: "3.9", paramiko: latest }
          - { os: macos-latest, python: "3.13", paramiko: latest }
          - { os: windows-latest, python: "3.13", paramiko: latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.paramiko }}" = "latest" ]; then spec="paramiko"; else spec="paramiko==${{ matrix.paramiko }}"; fi
          python -m pip install . "$spec" pytest pytest-cov cryptography
          python -m pip list
      - name: Test
        run: python -m pytest --cov --cov-report=term-missing

  # The same API against a real OpenSSH server in Docker, where its behaviour
  # can differ from the in-process test server.
  integration:
    name: Integration · OpenSSH server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install . pytest cryptography
      - name: Start the OpenSSH server
        run: tests/integration/openssh-server.sh >> "$GITHUB_ENV"
      - name: Test
        shell: bash # with pipefail, so a pytest failure isn't hidden by tee
        run: |
          python -m pytest tests/integration -v | tee "$RUNNER_TEMP/pytest.log"
          # Fail if the tests were skipped instead of run.
          grep -q " passed" "$RUNNER_TEMP/pytest.log"

  # The one check for branch protection to require, so the rule needn't change
  # whenever the test matrix does. The pre-release job is allowed to fail.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, test, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Check that lint and every test job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  prerelease:
    name: py3.15 (pre-release) · paramiko latest
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - run: python -m pip install . paramiko pytest cryptography
      - run: python -m pytest
