[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pysftp-ng"
dynamic = ["version"]
description = "Maintained, drop-in fork of pysftp that fixes the DSSKey ImportError on paramiko 4 and 5."
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Jeff Hinrichs" },
    { name = "Abdul Hakim Aremeyaw" },
]
maintainers = [{ name = "Abdul Hakim Aremeyaw" }]
keywords = ["sftp", "ssh", "ftp", "paramiko", "pysftp", "file transfer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = ["paramiko>=3.4"]

[project.urls]
Homepage = "https://github.com/Vitalik-Hakim/pysftp-ng"
Documentation = "https://pysftp-ng.readthedocs.io"
Source = "https://github.com/Vitalik-Hakim/pysftp-ng"
Issues = "https://github.com/Vitalik-Hakim/pysftp-ng/issues"
Changelog = "https://github.com/Vitalik-Hakim/pysftp-ng/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.20; python_version >= '3.10'",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "types-paramiko>=5; python_version >= '3.10'",
]

[tool.hatch.version]
path = "src/pysftp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pysftp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pysftp",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "SECURITY.md",
    "CONTRIBUTING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "regression: reproduces a bug present in pysftp 0.2.9",
    "integration: needs a real SSH server; skipped unless PYSFTP_INTEGRATION_* is set",
]
filterwarnings = [
    "error",
    # paramiko itself still imports ciphers that cryptography has deprecated
    "ignore::DeprecationWarning:paramiko.*",
    "ignore:.*TripleDES.*",
    "ignore:.*Blowfish.*",
]

[tool.coverage.run]
source = ["pysftp"]
branch = true

[tool.coverage.report]
# `pytest --cov`, as CI's test jobs run it, fails when coverage drops below this.
fail_under = 90

[tool.mypy]
files = ["src"]
strict = true

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "PT", "RUF"]
ignore = [
    "UP007",  # keep Union[...] spelling where it is evaluated at runtime on 3.9
    "RUF022", # __all__ is grouped by hand
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S108", "S505", "S603", "S607"]
